name: Windows audio
on: [push, pull_request]
jobs:
  build-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure (MSVC x64)
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Core, streaming and APO tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Installer rollback
        shell: powershell
        run: ./Tests/WindowsInstallerTests.ps1
      - name: Package (unsigned)
        run: cmake --install build --config Release --prefix build/package
      - uses: actions/upload-artifact@v4
        with:
          name: MacTools-Windows-x64-unsigned
          path: build/package
