name: Windows audio
on: [push, pull_request]
jobs:
  build-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Configure (MSVC x64)
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Core, streaming and APO tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Installer rollback
        shell: powershell
        run: ./Tests/WindowsInstallerTests.ps1
      - name: Antigravity bridge HTTP and subprocess tests
        run: dotnet run --project Tests/AntigravityBridge/AntigravityBridgeTests.csproj -c Release
      - name: Package (unsigned)
        run: cmake --install build --config Release --prefix build/package
      - name: Publish WinUI 3 (self-contained)
        run: dotnet publish Sources/Windows/WinUI/SoundControlWindows.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -o build/package/ui
      - uses: actions/upload-artifact@v4
        with:
          name: SoundControl-Windows-x64-unsigned
          path: build/package
